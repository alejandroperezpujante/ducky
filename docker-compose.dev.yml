services:
  app:
    env_file: .env.development
    depends_on:
      - mailpit

  web:
    ports: !override
      - "8080:80"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    expose:
      - "1025" # SMTP — internal only; app reaches it as mailpit:1025
    ports:
      - "8025:8025" # Web UI
    volumes:
      - mailpit_data:/data

volumes:
  mailpit_data:

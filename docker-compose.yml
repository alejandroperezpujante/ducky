services:
  app:
    build:
      context: .
      target: app
    env_file: .env
    volumes:
      # Persist writable Tempest cache (.tempest/) across container restarts
      - tempest_cache:/var/www/html/.tempest
    expose:
      - "9000"
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    depends_on:
      - app
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  # Named volume keeps session + runtime cache across deploys
  tempest_cache:

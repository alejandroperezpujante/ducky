services:
  app:
    build:
      context: .
      target: app
    env_file: .env
    volumes:
      # Persist writable Tempest cache (.tempest/) across container restarts
      - tempest_cache:/var/www/html/.tempest
      # Persist SQLite database file across deploys (image is replaced each deploy)
      - database_data:/var/www/html/database
    expose:
      - "9000"
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    depends_on:
      - app
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  # Named volume keeps session + runtime cache across deploys
  tempest_cache:
  # Named volume keeps SQLite database file across deploys
  database_data:
